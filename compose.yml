# Obsidian Web — minimal self-hosted setup.
#   VAULT_PATH=/path/to/your/vault docker compose up -d --build
# Then open http://localhost:8099
# Put it behind a reverse proxy that handles auth (Authelia, Cloudflare Access,
# Tailscale, basic auth...) before exposing it to the internet.
services:
  obsidian-web:
    build: .
    container_name: obsidian-web
    restart: unless-stopped
    environment:
      VAULT_DIR: /vault
      READ_ONLY: "${READ_ONLY:-false}"   # "true" = read-only
    volumes:
      - "${VAULT_PATH:-./examples/demo-vault}:/vault"
    ports:
      - "127.0.0.1:${PORT:-8099}:8000"   # localhost only; your proxy reaches it from here
